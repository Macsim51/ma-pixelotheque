# Exemple HTTPS : adapter domaine, certificats et adresse du backend.
server {
    listen 443 ssl;
    server_name photos.example.org;
    ssl_certificate /etc/letsencrypt/live/photos.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photos.example.org/privkey.pem;

    location = /ma-pixelotheque {
        return 308 /ma-pixelotheque/;
    }

    location /ma-pixelotheque/ {
        # Désactiver ici les journaux d'accès hérités : les liens privés portent
        # leur secret dans l'URL. Cette règle couvre l'application entière.
        access_log off;
        # Le slash final retire le préfixe ; Django le remet dans ses URL.
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# Pour Nginx dans Docker, remplacer le backend par pixelotheque-web:8000
# et partager le réseau privé du reverse proxy, sans publier le port 8000.
# Les error logs peuvent aussi contenir une URI sur panne upstream : voir README.
