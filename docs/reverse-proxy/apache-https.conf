# Exemple de VirtualHost, à adapter avec un certificat existant et valide.
# Modules : ssl, proxy, proxy_http, headers, setenvif.
<VirtualHost *:443>
    ServerName photos.example.org
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/photos.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/photos.example.org/privkey.pem

    SetEnvIf Request_URI "^/ma-pixelotheque/s/" pixelotheque_private
    # Destination Debian/Apache à adapter. En cas d'intégration dans un vhost
    # existant, REMPLACER ses CustomLog ; ne pas laisser un second log non filtré.
    # Vérifier aussi les éventuels GlobalLog au niveau serveur (voir README).
    CustomLog "${APACHE_LOG_DIR}/access.log" combined env=!pixelotheque_private

    ProxyRequests Off
    ProxyPreserveHost On
    RedirectMatch 308 ^/ma-pixelotheque$ /ma-pixelotheque/
    ProxyPass        "/ma-pixelotheque/" "http://127.0.0.1:8000/" connectiontimeout=5 timeout=180 disablereuse=On
    ProxyPassReverse "/ma-pixelotheque/" "http://127.0.0.1:8000/"
    <Location "/ma-pixelotheque/">
        RequestHeader unset X-Forwarded-Proto
        RequestHeader set X-Forwarded-Proto "https"
    </Location>

    # Adapter au chemin du code vu depuis Apache si ce dossier est monté.
    <Directory "/var/www/html/ma-pixelotheque">
        Require all denied
    </Directory>
</VirtualHost>

# Si Apache est conteneurisé, utiliser pixelotheque-web:8000 à la place de
# 127.0.0.1:8000 et le réseau/override documenté dans README.md.
