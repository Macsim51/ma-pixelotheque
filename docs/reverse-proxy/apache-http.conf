# Fragment à inclure dans le VirtualHost HTTP existant, après relecture.
# Modules requis : proxy, proxy_http, headers, setenvif. Aucun fichier n'est installé
# automatiquement. Le proxy Apache partage le réseau Docker de l'application.
# AVANT UTILISATION : modifier les CustomLog/GlobalLog existants selon README.md.
# Le marqueur ci-dessous ne désactive pas à lui seul leurs écritures.

SetEnvIf Request_URI "^/ma-pixelotheque/s/" pixelotheque_private
# Remplacer chaque CustomLog existant sans condition par la même directive
# munie de env=!pixelotheque_private. Conserver sa destination et son format.
# Exemple de REMPLACEMENT, pas de directive supplémentaire à ajouter :
# CustomLog /proc/self/fd/1 combined env=!pixelotheque_private
# Si une condition existe déjà, la combiner selon le README plutôt que l'écraser.

ProxyRequests Off
ProxyPreserveHost On
RedirectMatch 308 ^/ma-pixelotheque$ /ma-pixelotheque/

# Placer ces règles avant un ProxyPass plus général.
ProxyPass        "/ma-pixelotheque/" "http://pixelotheque-web:8000/" connectiontimeout=5 timeout=180 disablereuse=On
ProxyPassReverse "/ma-pixelotheque/" "http://pixelotheque-web:8000/"

<Location "/ma-pixelotheque/">
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "http"
</Location>

# Adapter ce chemin au checkout VU DEPUIS Apache. Ce refus filesystem est actif
# si le code est dans le documentroot ; les requêtes applicatives restent proxifiées.
# Si le code n'est pas monté dans Apache, cette protection peut être omise.
<Directory "/var/www/html/ma-pixelotheque">
    Require all denied
</Directory>
